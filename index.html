<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Throne Survival</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
	<div id="ecranChargement">
		<video id="videoChargement" autoplay muted playsinline preload="auto">
			<source src="videos/Chargement.mp4" type="video/mp4">
		</video>
	</div>
    <main id="zoneNavigation">
        <div id="carteInteractive">
            <div id="surfaceCarte">
				<video
					id="mapPrincipale"
					autoplay
					muted
					loop
					playsinline
					preload="auto"
				>
					<source src="videos/MapPrincipale.mp4" type="video/mp4">
				</video>
                <div id="zones"></div>
            </div>
        </div>
    </main>

    <div id="fenetreZone" class="masquee">
        <div id="fondFenetre"></div>
		<div id="contenuFenetre">
			<div id="surfaceZone">

				<!-- Image principale de la zone -->
				<img id="imageZone" src="" alt="">

				<!-- Logos interactifs -->
				<button
					id="boutonListeLoot"
					class="logoZone"
					type="button"
					aria-label="Afficher la liste de loot"
					aria-expanded="false"
				>
					<img src="images/listeLoot/LogoListeLoot.png" alt="">
				</button>

				<button
					id="boutonActionZone"
					class="logoZone"
					type="button"
					aria-label="Afficher l'action de la zone"
					aria-expanded="false"
				>
					<img src="images/listeAction/LogoActionZone.png" alt="">
				</button>

				<!-- Image d'information du loot -->
				<img
					id="imageListeLoot"
					class="imageInfo masquee"
					src=""
					alt="Liste de loot et effet de zone"
				>

				<!-- Image d'information de l'action -->
				<img
					id="imageActionZone"
					class="imageInfo masquee"
					src=""
					alt="Action réalisable dans cette zone"
				>

			</div>
		</div>
    </div> 
    <audio id="sonFond" loop preload="auto">
        <source src="son/sonFond.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
