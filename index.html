<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Throne Survival</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
	<div id="ecranChargement">
		<video id="videoChargement" autoplay muted playsinline preload="auto">
			<source src="videos/Chargement.mp4" type="video/mp4">
		</video>
	</div>
	<main id="zoneNavigation">
		<div id="carteInteractive">
			<div id="ensembleCarte">

				<div id="portraitsGauche" class="groupePortraits"></div>

				<div id="surfaceCarte">
					<video id="mapPrincipale" autoplay muted loop playsinline>
						<source src="videos/MapPrincipale.mp4" type="video/mp4">
					</video>
					<img id="calqueChemins" src="images/chemins.png" alt="">
					<div id="zones"></div>
				</div>

				<div id="portraitsDroite" class="groupePortraits"></div>

			</div>
		</div>
	</main>
	<button id="boutonChemins" type="button">
		Afficher les chemins
	</button>
    <div id="fenetreZone" class="masquee">
        <div id="fondFenetre"></div>
		<div id="contenuFenetre">
			<div id="surfaceZone">

				<!-- Image principale de la zone -->
				<img id="imageZone" src="" alt="">

				<!-- Logos interactifs -->
				<button
					id="boutonListeLoot"
					class="logoZone"
					type="button"
					aria-label="Afficher la liste de loot"
					aria-expanded="false"
				>
					<img src="images/listeLoot/LogoListeLoot.png" alt="">
				</button>

				<button
					id="boutonActionZone"
					class="logoZone"
					type="button"
					aria-label="Afficher l'action de la zone"
					aria-expanded="false"
				>
					<img src="images/listeAction/LogoActionZone.png" alt="">
				</button>

				<!-- Image d'information du loot -->
				<img
					id="imageListeLoot"
					class="imageInfo masquee"
					src=""
					alt="Liste de loot et effet de zone"
				>

				<!-- Image d'information de l'action -->
				<img
					id="imageActionZone"
					class="imageInfo masquee"
					src=""
					alt="Action réalisable dans cette zone"
				>

			</div>
		</div>
    </div> 
	<!-- Visionneuse des portraits -->
	<div id="visionneusePortrait" class="masquee">
		<div id="fondVisionneuse"></div>
		<img id="imagePortraitAgrandie" src="" alt="Portrait du joueur">
	</div>
    <audio id="sonFond" loop preload="auto">
        <source src="son/sonFond.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
